<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2f855a">
  <meta name="description" content="소분 보관과 식비 절약을 위한 냉장고 재고 관리 앱">
  <title>냉장고 소분 관리</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="appbar">
    <h1 id="pageTitle">우리집 냉장고</h1>
    <div id="appbarInfo" class="appbar-info"></div>
  </header>

  <main id="view" class="view"></main>

  <nav class="tabbar" aria-label="메인 메뉴">
    <button data-tab="fridge"><span class="ico">🧊</span><span>냉장고</span></button>
    <button data-tab="add"><span class="ico">➕</span><span>등록</span></button>
    <button data-tab="recipe"><span class="ico">🍳</span><span>뭐 먹지?</span></button>
    <button data-tab="shop"><span class="ico">🛒</span><span>장보기</span><i class="tab-badge" id="shopBadge" hidden></i></button>
    <button data-tab="settings"><span class="ico">⚙️</span><span>설정</span></button>
  </nav>

  <div id="sheetRoot"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="js/recipes.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
